<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14161c">
<title>GdA Companion</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header id="hdr">
  <h1><b>GdA</b> Companion</h1>
  <button id="searchbtn" class="iconbtn" aria-label="Search">🔍</button>
  <button id="themebtn" class="iconbtn" aria-label="Theme">☀️</button>
</header>

<main>
  <section class="tab" id="tab-charge"></section>
  <section class="tab" id="tab-rolloff"></section>
  <section class="tab" id="tab-fire"></section>
  <section class="tab" id="tab-tracker"></section>
  <section class="tab" id="tab-procedures"></section>
  <section class="tab" id="tab-nations"></section>
  <section class="tab" id="tab-tactics"></section>
  <section class="tab" id="tab-terrain"></section>
</main>

<nav id="tabbar" aria-label="Tabs"></nav>

<div id="searchpanel">
  <header>
    <input id="searchinput" type="search" placeholder="Search rules, tactics, terrain…" autocomplete="off">
    <button id="searchclose" class="iconbtn" aria-label="Close">✕</button>
  </header>
  <div id="searchresults"></div>
</div>

<div id="theatre"></div>

<script src="js/data.js"></script>
<script src="scenarios/hochberg.js"></script>
<script src="js/app.js"></script>
<script src="js/charge.js"></script>
<script src="js/melee.js"></script>
<script src="js/rolloff.js"></script>
<script src="js/fire.js"></script>
<script src="js/tracker.js"></script>
<script src="js/content.js"></script>
</body>
</html>
