<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14161c">
<title>GdA Companion</title>
<link rel="stylesheet" href="css/app.css?v=12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GdA">
</head>
<body>
<header id="hdr">
  <h1><b>GdA</b> Companion</h1>
  <button id="searchbtn" class="iconbtn" aria-label="Search">🔍</button>
  <button id="themebtn" class="iconbtn" aria-label="Theme">☀️</button>
</header>

<main>
  <section class="tab" id="tab-charge"></section>
  <section class="tab" id="tab-rolloff"></section>
  <section class="tab" id="tab-fire"></section>
  <section class="tab" id="tab-tracker"></section>
  <section class="tab" id="tab-procedures"></section>
  <section class="tab" id="tab-nations"></section>
  <section class="tab" id="tab-tactics"></section>
  <section class="tab" id="tab-terrain"></section>
</main>

<nav id="tabbar" aria-label="Tabs"></nav>

<div id="searchpanel">
  <header>
    <input id="searchinput" type="search" placeholder="Search rules, tactics, terrain…" autocomplete="off">
    <button id="searchclose" class="iconbtn" aria-label="Close">✕</button>
  </header>
  <div id="searchresults"></div>
</div>

<div id="theatre"></div>

<script src="js/vendor/qrcode-gen.js?v=12"></script>
<script src="js/vendor/jsqr.js?v=12"></script>
<script src="js/data.js?v=12"></script>
<script src="scenarios/hochberg.js?v=12"></script>
<script src="js/app.js?v=12"></script>
<script src="js/pair.js?v=12"></script>
<script src="js/charge.js?v=12"></script>
<script src="js/melee.js?v=12"></script>
<script src="js/rolloff.js?v=12"></script>
<script src="js/fire.js?v=12"></script>
<script src="js/tracker.js?v=12"></script>
<script src="js/content.js?v=12"></script>
<script>
// PWA: offline cache + home-screen install. file:// has no SW support —
// the app still works there, just without the offline cache layer.
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
